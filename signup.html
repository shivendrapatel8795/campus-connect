<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CampusConnect</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/signup.css">

</head>

<body>

    <!-- Navbar -->

    <div id="navbar"></div>

    <main>

        <section class="signup">

            <div class="container">

                <div class="signup__wrapper">

                    <!-- LEFT CONTENT -->

                    <div class="signup__content" data-aos="fade-right">

                        <span class="signup__badge">

                            Join CampusConnect

                        </span>

                        <h1 class="signup__title">

                            Create Your

                            <span>Campus Account</span>

                        </h1>

                        <p class="signup__description">

                            Register as a student,
                            teacher or administrator
                            and experience a smarter
                            campus management system.

                        </p>

                        <ul class="signup__features">

                            <li>

                                <i class="fa-solid fa-circle-check"></i>

                                Secure Registration

                            </li>

                            <li>

                                <i class="fa-solid fa-circle-check"></i>

                                Role Based Access

                            </li>

                            <li>

                                <i class="fa-solid fa-circle-check"></i>

                                Modern User Experience

                            </li>

                        </ul>

                    </div>

                    <!-- RIGHT CONTENT -->

                    <div class="signup__card" data-aos="fade-left">

                        <h2>

                            Create Account

                        </h2>

                        <form id="signupForm">

                            <!-- Full Name -->

                            <div class="form-group">

                                <label>

                                    Full Name

                                </label>

                                <input type="text" id="fullName" placeholder="Enter your full name" required>

                            </div>

                            <!-- Email -->

                            <div class="form-group">

                                <label>

                                    Email Address

                                </label>

                                <input type="email" id="email" placeholder="Enter your email" required>

                            </div>

                            <!-- Phone -->

                            <div class="form-group">

                                <label>

                                    Phone Number

                                </label>

                                <input type="tel" id="phone" placeholder="Enter phone number" required>

                            </div>

                            <!-- Role -->

                            <div class="form-group">

                                <label>

                                    Register As

                                </label>

                                <select id="role" required>

                                    <option value="">

                                        Select Role

                                    </option>

                                    <option value="student">

                                        Student

                                    </option>

                                    <option value="teacher">

                                        Teacher

                                    </option>

                                    <option value="admin">

                                        Administrator

                                    </option>

                                </select>

                            </div>

                            <!-- Department -->

                            <div class="form-group">

                                <label>

                                    Department

                                </label>

                                <select id="department" required>

                                    <option value="">

                                        Select Department

                                    </option>

                                    <option>

                                        Computer Science

                                    </option>

                                    <option>

                                        Information Technology

                                    </option>

                                    <option>

                                        Artificial Intelligence

                                    </option>

                                    <option>

                                        Electronics

                                    </option>

                                    <option>

                                        Mechanical

                                    </option>

                                    <option>

                                        Civil

                                    </option>

                                </select>

                            </div>

                            <!-- Password -->

                            <div class="form-group">

                                <label>

                                    Password

                                </label>

                                <div class="password-box">

                                    <input type="password" id="password" placeholder="Create password" required>

                                    <button type="button" id="togglePassword">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <!-- Confirm Password -->

                            <div class="form-group">

                                <label>

                                    Confirm Password

                                </label>

                                <div class="password-box">

                                    <input type="password" id="confirmPassword" placeholder="Confirm password" required>

                                    <button type="button" id="toggleConfirmPassword">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <!-- Terms -->

                            <div class="signup__options">

                                <label>

                                    <input type="checkbox" id="terms" required>

                                    I agree to the Terms &
                                    Conditions

                                </label>

                            </div>

                            <!-- Button -->

                            <button class="signup-btn" type="submit">

                                Create Account

                            </button>

                            <!-- Login Link -->

                            <p class="login-link">

                                Already have an account?

                                <a href="login.html">

                                    Login Here

                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- JavaScript -->

    <script src="assets/js/app.js"></script>

    <script src="assets/js/signup.js"></script>

</body>

</html>
